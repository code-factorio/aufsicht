# aufsicht CI — the real gate (v5.1 §5: pre-commit runs quality-fast
# only; CI runs quality-full, read-only, never commits).
#
# fetch-depth: 0 is load-bearing, not cosmetic (v5.1 §4.6): the default
# shallow checkout makes `git merge-base` fail or lie, and the gate
# exits 3 rather than silently disable every ratchet.
name: aufsicht

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  quality-full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # uv ships with the runner install (v5.1 §4.4: uv is the supported
      # resolver — the pip-audit gate and the project-env build exit 3
      # without it).
      - name: Install the pinned aufsicht runner and uv (distribution spec §3)
        run: pip install aufsicht=={{RUNNER_VERSION}} uv

      - name: quality-full
        shell: bash
        run: |
          set -o pipefail
          aufsicht full | tee aufsicht-report.json

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aufsicht-report
          path: aufsicht-report.json
