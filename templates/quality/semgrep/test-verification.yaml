# Observable-verification acts (v5.1 §9.1).
#
# Two rule families, both severity INFO — the adapter computes the
# gate: a changed test function (span overlapping added lines) with no
# verification-act match is the violation.
#
# This file is GENERATED by `aufsicht init` from the [test_verification]
# set in .quality/config.toml. Edit the config and re-run init (a
# guardrail-change PR, v5.1 §11.1) — do not hand-edit into drift.
rules:
  - id: pytest-test-function
    message: test function (scope marker)
    languages: [python]
    severity: INFO
    pattern: |
      def $NAME(...):
          ...

  - id: verification-act-assert
    message: verification act (assert statement, v5.1 §9.1)
    languages: [python]
    severity: INFO
    pattern: |
      def $NAME(...):
          ...
          assert ...

  - id: verification-act-pytest-raises
    message: verification act (pytest.raises, v5.1 §9.1)
    languages: [python]
    severity: INFO
    pattern: |
      def $NAME(...):
          ...
          pytest.raises(...)

  - id: verification-act-pytest-warns
    message: verification act (pytest.warns, v5.1 §9.1)
    languages: [python]
    severity: INFO
    pattern: |
      def $NAME(...):
          ...
          pytest.warns(...)

  - id: verification-act-pytest-deprecated-call
    message: verification act (pytest.deprecated_call, v5.1 §9.1)
    languages: [python]
    severity: INFO
    pattern: |
      def $NAME(...):
          ...
          pytest.deprecated_call(...)

  - id: verification-act-unittest
    message: verification act (unittest assert/fail, v5.1 §9.1)
    languages: [python]
    severity: INFO
    pattern: |
      def $NAME(...):
          ...
          self.assert$k(...)
    # note: self.assert* is itself a glob over assertAlmostEqual etc.;
    # semgrep metavariable suffix $k covers the rest of the name.

  - id: verification-act-helper
    message: verification act (assert_*/check_*/verify_* helper naming)
    languages: [python]
    severity: INFO
    pattern: |
      def $NAME(...):
          ...
          assert_$REST(...)

  - id: verification-act-helper-check
    message: verification act (check_* helper naming)
    languages: [python]
    severity: INFO
    pattern: |
      def $NAME(...):
          ...
          check_$REST(...)

  - id: verification-act-helper-verify
    message: verification act (verify_* helper naming)
    languages: [python]
    severity: INFO
    pattern: |
      def $NAME(...):
          ...
          verify_$REST(...)

  - id: verification-act-mock-assert
    message: verification act (mock assertion, weak but observable)
    languages: [python]
    severity: INFO
    pattern: |
      def $NAME(...):
          ...
          $M.assert_called$k(...)

  - id: verification-act-snapshot
    message: verification act (snapshot / syrupy / approvaltests)
    languages: [python]
    severity: INFO
    pattern: |
      def $NAME(...):
          ...
          snapshot(...)
