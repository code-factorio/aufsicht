# Observable-verification acts (v5.1 §9.1).
#
# Two rule families, both severity INFO — the adapter computes the
# gate: a changed test function (span overlapping added lines) with no
# verification-act match is the violation.
#
# Measured against semgrep 1.173.0:
#   * metavariable-suffix patterns (`self.assert$k`, `assert_$REST`)
#     DO NOT PARSE — prefix matching uses metavariable-regex instead;
#   * metavariable-regex as a SIBLING of `pattern:` is silently
#     ignored — it must be nested under `patterns:`;
#   * `with pytest.raises(...)` does not match a bare
#     `pytest.raises(...)` statement pattern — both forms are listed.
#
# This file is GENERATED by `aufsicht init` from the [test_verification]
# set in .quality/config.toml. Edit the config and re-run init (a
# guardrail-change PR, v5.1 §11.1) — do not hand-edit into drift.
rules:
  - id: pytest-test-function
    message: test function (scope marker)
    languages: [python]
    severity: INFO
    patterns:
      - pattern: |
          def $NAME(...):
              ...
      - metavariable-regex:
          metavariable: $NAME
          regex: ^test

  - id: verification-act-assert
    message: verification act (assert statement, v5.1 §9.1)
    languages: [python]
    severity: INFO
    pattern: |
      def $NAME(...):
          ...
          assert ...

  - id: verification-act-pytest-raises
    message: verification act (pytest.raises, v5.1 §9.1)
    languages: [python]
    severity: INFO
    pattern-either:
      - pattern: |
          def $NAME(...):
              ...
              pytest.raises(...)
      - pattern: |
          def $NAME(...):
              ...
              with pytest.raises(...):
                  ...

  - id: verification-act-pytest-warns
    message: verification act (pytest.warns, v5.1 §9.1)
    languages: [python]
    severity: INFO
    pattern-either:
      - pattern: |
          def $NAME(...):
              ...
              pytest.warns(...)
      - pattern: |
          def $NAME(...):
              ...
              with pytest.warns(...):
                  ...

  - id: verification-act-pytest-deprecated-call
    message: verification act (pytest.deprecated_call, v5.1 §9.1)
    languages: [python]
    severity: INFO
    pattern-either:
      - pattern: |
          def $NAME(...):
              ...
              pytest.deprecated_call(...)
      - pattern: |
          def $NAME(...):
              ...
              with pytest.deprecated_call(...):
                  ...

  - id: verification-act-unittest
    message: verification act (unittest self.assert*/self.fail, v5.1 §9.1)
    languages: [python]
    severity: INFO
    patterns:
      - pattern: |
          def $NAME(...):
              ...
              self.$METHOD(...)
      - metavariable-regex:
          metavariable: $METHOD
          regex: ^(assert|fail)

  - id: verification-act-helper
    message: verification act (assert_*/check_*/verify_*/snapshot/verify helper naming, v5.1 §9.1)
    languages: [python]
    severity: INFO
    patterns:
      - pattern: |
          def $NAME(...):
              ...
              $FUNC(...)
      - metavariable-regex:
          metavariable: $FUNC
          regex: ^(assert_|check_|verify_|verify$|snapshot$)

  - id: verification-act-mock-assert
    message: verification act (mock assertion, weak but observable, v5.1 §9.1)
    languages: [python]
    severity: INFO
    patterns:
      - pattern: |
          def $NAME(...):
              ...
              $OBJ.$METHOD(...)
      - metavariable-regex:
          metavariable: $METHOD
          regex: ^assert_
