[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aufsicht"
version = "0.2.4"
description = "Deterministic AI code quality guardrails for Python repositories (spec v5.1, Tier 1)"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Vinzenz Feenstra" }]
keywords = ["quality", "guardrails", "ai", "lint", "ratchet"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]
# No runtime dependencies. The runner is a standalone tool, not a project
# dependency (distribution spec §3), and manages its own analyzer
# environments keyed on lockfile hash (v5.1 §4.4).

[project.scripts]
aufsicht = "aufsicht.cli:main"

[dependency-groups]
dev = ["pytest>=9"]

[tool.hatch.build.targets.wheel]
packages = ["src/aufsicht"]

# Ship the templates inside the wheel: an installed runner must carry
# its own .quality/ templates (distribution spec §4); the fallback in
# init/writers.py covers editable checkouts.
[tool.hatch.build.targets.wheel.force-include]
"templates" = "aufsicht/templates"

[tool.hatch.build.targets.sdist]
include = ["/src", "/templates", "/tests", "/spec", "/skill", "/install", "/README.md"]
