[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aufsicht"
version = "0.1.0"
description = "Deterministic AI code quality guardrails for Python repositories (spec v5.1, Tier 1)"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Vinzenz Feenstra" }]
keywords = ["quality", "guardrails", "ai", "lint", "ratchet"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]
# No runtime dependencies. The runner is a standalone tool, not a project
# dependency (distribution spec §3), and manages its own analyzer
# environments keyed on lockfile hash (v5.1 §4.4).

[project.scripts]
aufsicht = "aufsicht.cli:main"

[dependency-groups]
dev = ["pytest>=9"]

[tool.hatch.build.targets.wheel]
packages = ["src/aufsicht"]
