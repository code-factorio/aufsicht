# aufsicht CI — the real gate (v5.1 §5: pre-commit runs quality-fast
# only; CI runs quality-full, read-only, never commits).
#
# fetch-depth: 0 is load-bearing, not cosmetic (v5.1 §4.6): the default
# shallow checkout makes `git merge-base` fail or lie, and the gate
# exits 3 rather than silently disable every ratchet.
name: aufsicht

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  quality-full:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Self-hosting (distribution spec §7): this repository runs its
      # own guardrails FROM THE WORKING TREE, not the published version.
      # Target repositories install the pinned runner from the index
      # instead (distribution spec §3).
      # uv ships with the runner install (v5.1 §4.4: uv is the supported
      # resolver — the pip-audit gate exits 3 without it, and the
      # self-tests spawn the CLI in scratch repos that freeze through it).
      # pytest is the dev dependency-group: the gate runs pytest inside
      # its own pinned analyzer env, but the self-test step below runs
      # the suite with this interpreter.
      - name: Install the runner from the working tree
        run: |
          python -m pip install --upgrade pip
          python -m pip install . uv pytest

      - name: quality-full
        shell: bash
        run: |
          set -o pipefail
          aufsicht full | tee aufsicht-report.json

      - name: Runner self-test suite (v5.1 §18 / distribution §8)
        env:
          AUFSICHT_CACHE_DIR: ${{ runner.temp }}/aufsicht-cache
        run: python -m pytest tests -q

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aufsicht-report
          path: aufsicht-report.json

  # Publishing (distribution spec §14's open decision, resolved: the
  # index is the channel). Runs only from main and only after a green
  # quality-full, so merging to main IS the release decision — the
  # same reviewed-PR approval act the protected paths already use.
  # Credentials are trusted publishing (OIDC): no token in the repo.
  # PyPI must list this repository as a trusted publisher with
  # workflow name "aufsicht" (and no environment).
  publish:
    needs: quality-full
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write  # PyPI trusted publishing (OIDC)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Version-bump guardrail (distribution spec §10): the index
      # already rejects a re-uploaded version, but late and without a
      # remedy. This fails first, naming the five places the runner
      # version lives, so a change that forgot the bump reads the fix
      # instead of a "file already exists" 400.
      - name: Version-bump guardrail
        run: |
          python - <<'EOF'
          import json
          import sys
          import tomllib
          import urllib.error
          import urllib.request

          project = tomllib.load(open("pyproject.toml", "rb"))["project"]
          name, version = project["name"], project["version"]

          def semver(value):
              parts = value.split(".")
              if len(parts) != 3 or not all(p.isdigit() for p in parts):
                  sys.exit(f"{name} version {value!r} is not X.Y.Z semver (distribution spec §10)")
              return tuple(int(p) for p in parts)

          try:
              with urllib.request.urlopen(f"https://pypi.org/pypi/{name}/json") as response:
                  published = json.load(response)["info"]["version"]
          except urllib.error.HTTPError as error:
              if error.code == 404:
                  print(f"{name} not on the index yet — first release, proceeding")
                  sys.exit(0)
              raise

          if semver(version) <= semver(published):
              sys.exit(
                  f"refusing to publish {name} {version}: index already has {published}."
                  " Every green push to main publishes; bump the version in all five"
                  " places (pyproject.toml, src/aufsicht/__init__.py, install/bootstrap.sh,"
                  " skill/scripts/bootstrap.sh, .quality/toolchain.lock), then push again"
                  " (semver per distribution spec §10)."
              )
          print(f"version guardrail ok: {published} -> {version}")
          EOF

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
